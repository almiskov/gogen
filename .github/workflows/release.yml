name: Release Extension

on:
    push: 
        tags: 
            - 'v*'
        branches:
          - master

jobs:
    build-and-release:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Node
            uses: actions/setup-node@v4
            with:
                node-version: '20'

          - name: Install deps
            run: npm ci

          - name: Install VSCE
            run: npm install -g @vscode/vsce
            
          - name: Package extension
            run: npm run package

          - name: Create release
            uses: softprops/action-gh-release@v2
            with:
                files: *vsix
            
        
  